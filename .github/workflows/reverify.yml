name: Re-verify receipts

# Re-runs published receipts on GitHub's machines with Docker: no account, no API key.
# Anyone can fork the repository and run this workflow from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      receipts:
        description: "Receipt file names in receipts/ separated by spaces, or 'all'"
        default: "all"
        required: true

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      receipts: ${{ steps.pick.outputs.receipts }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          WANTED: ${{ inputs.receipts }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, pathlib
          wanted = os.environ["WANTED"].split()
          names = sorted(p.name for p in pathlib.Path("receipts").glob("*.json"))
          if wanted != ["all"]:
              missing = [w for w in wanted if w not in names]
              if missing:
                  raise SystemExit(f"not in receipts/: {missing}")
              names = wanted
          print("receipts=" + json.dumps(names))
          EOF

  reverify:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        receipt: ${{ fromJSON(needs.list.outputs.receipts) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for large task images
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.11.14/install.sh | sh
      - name: Install Receipts
        run: uv sync
      - name: Re-verify
        id: run
        run: |
          set +e
          uv run receipts reverify "receipts/${{ matrix.receipt }}" 2>&1 | tee reverify.log
          code=${PIPESTATUS[0]}
          mkdir -p result
          printf '{"receipt": "%s", "exit_code": %s}\n' "${{ matrix.receipt }}" "$code" > result/result.json
          tail -n 12 reverify.log > result/tail.txt
          exit "$code"
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.receipt }}
          path: result/

  summary:
    needs: reverify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Summarize
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          rows = [json.loads(p.read_text()) for p in sorted(pathlib.Path("results").glob("*/result.json"))]
          agree = [r for r in rows if r["exit_code"] == 0]
          print(f"## {len(agree)} of {len(rows)} receipts: every check agrees\n")
          print("| Receipt | Result |")
          print("| --- | --- |")
          for r in rows:
              label = {0: "every check agrees", 1: "a check disagrees", 2: "infrastructure error"}.get(r["exit_code"], f"exit {r['exit_code']}")
              print(f"| `{r['receipt']}` | {label} |")
          EOF
