[project]
name = "receipts"
version = "0.0.1"
description = "A coding agent that has to prove its green: sandboxed branches, executor-owned receipts, a deterministic gate."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "daytona>=0.220",
    "openai>=1.40",
    "pydantic>=2.7",
]

[project.scripts]
receipts = "receipts.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/receipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import from src directly: on macOS uv marks .venv files hidden and Python 3.13+
# skips hidden .pth files, so the editable install alone is not importable.
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
